services:
  - type: web
    name: ai-teacher
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false        # строка подключения к бесплатной Postgres (Neon)
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: ministral-14b-latest
      - key: MISTRAL_FALLBACK_MODEL
        value: magistral-small-latest
      - key: GEMINI_IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: GEMINI_IMAGE_ENABLED
        value: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false        # Firebase Admin JSON; private server-side secret
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Tasked
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: eastus
      - key: AZURE_SPEECH_VOICE
        value: ru-RU-SvetlanaNeural
      - key: AZURE_SPEECH_VOICE_KK
        value: kk-KZ-AigulNeural
      - key: FISH_API_KEY
        sync: false        # fish.audio → API Keys (бесплатная модель s2.1-pro-free)
      - key: FISH_MODEL
        value: s2.1-pro-free
      - key: FISH_VOICE_RU
        value: e897cbd38bc94548b7f5340c9db5fc4d
      - key: FISH_VOICE_KK
        value: 93bb57166f474f43bdbdadec4c20298f
      - key: ADMIN_LOGIN
        value: pyfold
      - key: ADMIN_PASSWORD
        sync: false        # задаётся при первом создании аккаунта создателя
      - key: SESSION_SECRET
        generateValue: true
