services:
  - type: web
    name: ai-teacher
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false        # строка подключения к бесплатной Postgres (Neon)
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: ministral-14b-latest
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: eastus
      - key: AZURE_SPEECH_VOICE
        value: ru-RU-SvetlanaNeural
      - key: AZURE_SPEECH_VOICE_KK
        value: kk-KZ-AigulNeural
      - key: FISH_API_KEY
        sync: false        # fish.audio → API Keys (бесплатная модель s2.1-pro-free)
      - key: FISH_MODEL
        value: s2.1-pro-free
      - key: FISH_VOICE_RU
        value: e897cbd38bc94548b7f5340c9db5fc4d
      - key: FISH_VOICE_KK
        value: 93bb57166f474f43bdbdadec4c20298f
      - key: ADMIN_LOGIN
        value: pyfold
      - key: ADMIN_PASSWORD
        sync: false        # задаётся при первом создании аккаунта создателя
      - key: SESSION_SECRET
        generateValue: true
